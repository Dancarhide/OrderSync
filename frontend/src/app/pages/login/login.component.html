<div class="login-page">
  <div class="login-atmosphere" aria-hidden="true">
    <span class="orb orb-red"></span>
    <span class="orb orb-purple"></span>
    <span class="grid-fade"></span>
  </div>

  <main class="login-shell">
    <section class="login-panel" aria-labelledby="login-brand">
      <header class="login-header">
        <h1 id="login-brand" class="brand-name">OrderSync</h1>
        <p class="brand-tagline">Sync your orders in real time</p>
      </header>

      <form class="login-form" (ngSubmit)="onSubmit()" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="you@company.com"
            [(ngModel)]="email" [disabled]="loading" />
        </div>

        <div class="field">
          <div class="field-label-row">
            <label for="password">Password</label>
            <a class="link-muted" href="#" (click)="$event.preventDefault()">Forgot your password?</a>
          </div>
          <div class="password-wrap">
            <input id="password" name="password" [type]="showPassword ? 'text' : 'password'"
              autocomplete="current-password" placeholder="••••••••" [(ngModel)]="password" [disabled]="loading" />
            <button type="button" class="toggle-pass" (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
        </div>

        <p *ngIf="error" class="form-error" role="alert">{{ error }}</p>

        <button type="submit" class="btn-primary" [disabled]="loading">
          <span *ngIf="!loading">Sign in</span>
          <span *ngIf="loading" class="btn-loading">
            <span class="spinner" aria-hidden="true"></span>
            Signing in…
          </span>
        </button>
      </form>
    </section>

    <aside class="login-visual" aria-hidden="true">
      <img class="visual-photo" src="assets/Logistica.jpg" alt="">
      <div class="visual-content">
        <p class="visual-kicker">OrderSync</p>
        <p class="visual-line">One view.</p>
        <p class="visual-line accent">Every channel.</p>
        <p class="visual-sub">Shopify · Amazon · and more — synced instantly.</p>
      </div>
    </aside>
  </main>
</div>
