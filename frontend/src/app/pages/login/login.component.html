<div class="min-h-screen w-full relative flex items-center justify-center p-4 sm:p-8 overflow-hidden">
  <!-- Full-bleed Blurred Logistics Background -->
  <img
    src="assets/Logistica.jpg"
    alt=""
    aria-hidden="true"
    class="fixed inset-0 w-full h-full object-cover scale-110 blur-[4px]"
  />
  <div
    class="fixed inset-0 bg-gradient-to-br from-emerald-950/75 via-teal-950/65 to-slate-950/80"
    aria-hidden="true"
  ></div>

  <!-- Main Floating Card -->
  <main class="relative z-10 w-full max-w-[900px] min-h-[500px] rounded-3xl overflow-hidden shadow-2xl shadow-black/45 flex flex-col md:flex-row">
    <!-- Card Background Photo -->
    <img
      src="assets/Logistica.jpg"
      alt=""
      aria-hidden="true"
      class="absolute inset-0 w-full h-full object-cover"
    />
    <div
      class="absolute inset-0 bg-gradient-to-tr from-emerald-950/70 via-emerald-900/35 to-teal-900/45"
      aria-hidden="true"
    ></div>

    <!-- Left White Panel with Smooth Organic Curve -->
    <section
      class="relative z-10 w-full md:w-[55%] bg-white md:bg-transparent px-8 py-10 sm:px-12 sm:py-12 md:pr-24 flex flex-col justify-center"
      aria-labelledby="login-brand"
    >
      <!-- Smooth Organic Wave SVG Shape (Desktop) -->
      <svg
        class="hidden md:block absolute inset-0 w-full h-full pointer-events-none drop-shadow-[8px_0_20px_rgba(0,0,0,0.2)]"
        viewBox="0 0 500 500"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <path
          fill="#ffffff"
          d="M0,0 L435,0
             C405,110 460,175 430,260
             C402,340 458,415 420,500
             L0,500 Z"
        />
      </svg>

      <!-- Structured Clean Form Content -->
      <div class="relative z-10 w-full max-w-[330px] mx-auto md:mx-0">
        <!-- Brand Lockup -->
        <div class="flex items-center gap-3 mb-7">
          <div class="w-10 h-10 rounded-xl bg-emerald-50 border border-emerald-200/80 flex items-center justify-center p-1.5 shadow-2xs">
            <img src="assets/Logo.png" alt="OrderSync Logo" class="w-full h-full object-contain" />
          </div>
          <div>
            <span id="login-brand" class="block text-base font-extrabold text-slate-900 tracking-tight leading-none">OrderSync</span>
            <span class="block text-[9px] font-bold uppercase tracking-[0.18em] text-emerald-700 mt-1">North America OMS</span>
          </div>
        </div>

        <!-- Heading -->
        <div class="mb-6">
          <h1 class="text-xl font-bold text-slate-900 tracking-tight">
            {{ mfaRequired ? 'Two-Factor Verification' : 'Welcome back' }}
          </h1>
          <p class="text-xs text-slate-500 mt-1">
            {{ mfaRequired ? 'Enter your 6-digit authenticator code (or 123456)' : 'Sign in to your operations console' }}
          </p>
        </div>

        <form class="space-y-4" (ngSubmit)="onSubmit()" novalidate>
          <!-- Standard Email & Password Fields -->
          <ng-container *ngIf="!mfaRequired">
            <!-- Email -->
            <div>
              <label for="email" class="block text-xs font-semibold text-slate-700 mb-1.5">Email</label>
              <div class="relative">
                <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="username"
                  placeholder="you@company.com"
                  [(ngModel)]="email"
                  [disabled]="loading"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-xs sm:text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-emerald-600 focus:ring-4 focus:ring-emerald-500/10 transition-all disabled:opacity-60"
                />
              </div>
            </div>

            <!-- Password -->
            <div>
              <label for="password" class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
              <div class="relative">
                <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                <input
                  id="password"
                  name="password"
                  [type]="showPassword ? 'text' : 'password'"
                  autocomplete="current-password"
                  placeholder="••••••••"
                  [(ngModel)]="password"
                  [disabled]="loading"
                  class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-xs sm:text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-emerald-600 focus:ring-4 focus:ring-emerald-500/10 transition-all disabled:opacity-60"
                />
                <button
                  type="button"
                  (click)="togglePassword()"
                  [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                  class="absolute right-3 top-1/2 -translate-y-1/2 p-1 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors cursor-pointer"
                >
                  <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                    <line x1="1" y1="1" x2="23" y2="23" />
                  </svg>
                </button>
              </div>
            </div>
          </ng-container>

          <!-- 2FA TOTP Code Step -->
          <div *ngIf="mfaRequired" class="space-y-3">
            <div>
              <label for="mfaCode" class="block text-xs font-semibold text-slate-700 mb-1.5">6-Digit MFA Code</label>
              <input
                id="mfaCode"
                name="mfaCode"
                type="text"
                inputmode="numeric"
                maxlength="6"
                placeholder="123456"
                [(ngModel)]="mfaCode"
                [disabled]="loading"
                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-center font-mono text-base tracking-[0.35em] font-bold text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-emerald-600 focus:ring-4 focus:ring-emerald-500/10 transition-all"
              />
            </div>
            <button
              type="button"
              (click)="cancelMfa()"
              class="text-xs font-semibold text-emerald-700 hover:underline cursor-pointer"
            >
              ← Use a different account
            </button>
          </div>

          <!-- Error Alert -->
          <div *ngIf="error" role="alert" class="px-3.5 py-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium flex items-center gap-2">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>{{ error }}</span>
          </div>

          <!-- Full-Width Symmetric Emerald Pill Button -->
          <div class="pt-1.5">
            <button
              type="submit"
              [disabled]="loading"
              class="w-full py-2.5 px-6 rounded-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] disabled:opacity-60 text-white text-sm font-semibold shadow-md shadow-emerald-600/20 transition-all cursor-pointer flex items-center justify-center gap-2"
            >
              <span *ngIf="!loading">{{ mfaRequired ? 'Verify & Sign in' : 'Sign in' }}</span>
              <span *ngIf="loading" class="inline-flex items-center gap-2">
                <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" aria-hidden="true"></span>
                Signing in…
              </span>
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- Right Photo Side Overlay Copy -->
    <aside class="hidden md:flex relative z-10 w-[45%] flex-col justify-end items-end text-right p-10 pointer-events-none" aria-hidden="true">
      <div class="drop-shadow-[0_2px_10px_rgba(0,0,0,0.45)]">
        <p class="text-3xl font-black tracking-tight text-white uppercase leading-none">
          One View.
        </p>
        <p class="text-sm font-bold tracking-[0.18em] text-emerald-300 uppercase mt-1.5">
          Every Shipment
        </p>
      </div>
    </aside>
  </main>
</div>
