services:
  - type: web
    name: ordersync-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SHOPIFY_SHOP_DOMAIN
        value: ordersync-ygnacmly.myshopify.com
      - key: SHOPIFY_API_VERSION
        value: "2024-01"
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: SHOPIFY_APP_SECRET
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
